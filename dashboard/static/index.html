<!DOCTYPE html>
<html lang="zh-CN" data-acl-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACL Console</title>
<link rel="stylesheet" href="app.css?v=11">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%230a0a0a'/><circle cx='8' cy='8' r='3.2' fill='%23fff'/></svg>">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-brand"><span class="wordmark">实验监控</span></div>
    <nav class="side-nav" id="nav">
      <button data-view="overview" class="on"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span>概览</span></button>
      <button data-view="experiments"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>实验</span></button>
      <button data-view="live"><svg viewBox="0 0 24 24"><path d="M3 13h3.5l2-6 4 12 2.5-6H21"/></svg><span>实时</span></button>
      <button data-view="streams"><svg viewBox="0 0 24 24"><path d="M4 8h13M4 12h16M4 16h9"/></svg><span>流</span></button>
      <button data-view="logs"><svg viewBox="0 0 24 24"><path d="M6 4.5h8l4 4v11H6z"/><path d="M14 4.5v4h4"/></svg><span>日志</span></button>
    </nav>
    <div class="side-foot">
      <div class="side-host" id="side-host"></div>
      <button class="theme" id="theme" aria-label="切换深浅色"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/></svg><span>主题</span></button>
    </div>
  </aside>

  <main class="content">
    <div class="sheet">

      <!-- 概览 -->
      <section id="view-overview" class="view">
        <div class="grid">
          <div class="cell hero-cell">
            <div class="hero-copy">
              <div class="eyebrow" id="hero-eyebrow">主实验</div>
              <div class="hero-num"><span id="bignum">—</span><span class="hero-unit" id="hero-unit"></span></div>
              <div class="hero-name" id="hero-name">—</div>
              <div class="hero-meta" id="hero-meta"></div>
              <div class="rule"><i id="hero-bar-fill"></i></div>
            </div>
          </div>
          <div class="cell halftone-cell"><canvas id="halftone"></canvas></div>
          <div class="cell sq"><div class="k">运行中</div><div class="v" id="t-run">—</div></div>
          <div class="cell sq"><div class="k">实验总数</div><div class="v" id="t-exp">—</div></div>
          <div class="cell sq"><div class="k">磁盘剩余<small>GB</small></div><div class="v" id="t-disk">—</div></div>
          <div class="cell sq"><div class="k">负载 1m</div><div class="v" id="t-load">—</div></div>

          <div class="cell span4">
            <div class="sec"><h2>运行中</h2><span class="note" id="ov-live-note"></span></div>
            <div id="ov-running" class="stack"></div>
          </div>
          <div class="cell span4">
            <div class="sec"><h2>最近结果</h2><span class="note">experiments/results_*.json</span></div>
            <div id="ov-results" class="stack"></div>
          </div>
        </div>
      </section>

      <!-- 实验 -->
      <section id="view-experiments" class="view" hidden>
        <div class="grid">
          <div class="cell sq"><div class="k">实验总数</div><div class="v" id="e-total">—</div></div>
          <div class="cell sq"><div class="k">运行中</div><div class="v" id="e-run">—</div></div>
          <div class="cell sq"><div class="k">已完成</div><div class="v" id="e-done">—</div></div>
          <div class="cell sq"><div class="k">有结果</div><div class="v" id="e-res">—</div></div>
          <div class="cell span4">
            <div class="sec">
              <h2>实验</h2>
              <div class="grow"></div>
              <input id="exp-filter" class="field" type="search" placeholder="筛选（如 P14）">
              <label class="check"><input type="checkbox" id="exp-archived"> 含归档</label>
            </div>
            <div id="exp-table"></div>
          </div>
        </div>
      </section>

      <!-- 实时 -->
      <section id="view-live" class="view" hidden>
        <div class="grid">
          <div class="cell span4">
            <div class="sec"><h2>实时状态</h2><div class="grow"></div><select id="live-state" class="field"></select></div>
          </div>
        </div>
        <div class="grid" id="live-kpis"></div>
        <div class="grid">
          <div class="cell span4">
            <div class="sec"><h2>状态维度 s1–s8</h2><span class="note" id="live-range"></span></div>
            <div id="live-dims" class="dims"></div>
          </div>
          <div class="cell span4">
            <div class="sec"><h2>状态文件</h2></div>
            <div id="live-meta" class="kv"></div>
          </div>
        </div>
      </section>

      <!-- 流 -->
      <section id="view-streams" class="view" hidden>
        <div class="grid">
          <div class="cell span4">
            <div class="sec"><h2>念头流 / 发声</h2><div class="grow"></div><select id="stream-state" class="field"></select></div>
          </div>
        </div>
        <div class="grid">
          <div class="cell span2">
            <div class="sec"><h2>inner_speech</h2></div>
            <div id="stream-inner" class="stream"></div>
          </div>
          <div class="cell span2">
            <div class="sec"><h2>vocalizations</h2></div>
            <div id="stream-voc" class="stream"></div>
          </div>
        </div>
      </section>

      <!-- 日志 -->
      <section id="view-logs" class="view" hidden>
        <div class="grid">
          <div class="cell span4">
            <div class="sec">
              <h2>日志</h2>
              <div class="grow"></div>
              <select id="log-file" class="field"></select>
              <button class="btn" id="log-refresh">刷新</button>
            </div>
            <pre id="log-body" class="log"></pre>
          </div>
        </div>
      </section>

      <footer class="foot">
        <span id="footer-status" class="note">连接中…</span>
        <div class="grow"></div>
        <a class="note" href="/api/overview" target="_blank" rel="noopener">REST API</a>
      </footer>
    </div>
  </main>
</div>

<script src="app.js?v=11"></script>
</body>
</html>
